
---
- name: Install Tailscale on Hetzner server
  hosts: fitness_servers
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Check whether Tailscale is installed
      ansible.builtin.command:
        cmd: tailscale version
      register: tailscale_check
      changed_when: false
      failed_when: false

    - name: Download official Tailscale installer
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0700"
      when: tailscale_check.rc != 0

    - name: Install Tailscale
      ansible.builtin.command:
        cmd: /bin/sh /tmp/tailscale-install.sh
      when: tailscale_check.rc != 0

    - name: Enable and start Tailscale
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true

    - name: Show Tailscale version
      ansible.builtin.command:
        cmd: tailscale version
      register: tailscale_version
      changed_when: false

    - name: Display Tailscale version
      ansible.builtin.debug:
        var: tailscale_version.stdout_lines
